<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>
  <text x="520" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Heran fan 5 V build - hole placement (7x3 cm, 24 x 10 holes)</text>
  <text x="520" y="48" text-anchor="middle" font-size="12" fill="#a33">SUGGESTED placement - verify footprints/pitch vs YOUR parts. Dashed = back-side jumper. Net list in BUILD_GUIDE §2e is authoritative.</text>

  <!-- board: 24 cols x 10 rows. pitch 36 px. origin hole (c1,r1)=(80,110). col x=80+(c-1)*36 -> c24=908 ; row y=110+(r-1)*36 -> r10=434 -->
  <rect x="52" y="82" width="884" height="380" rx="8" fill="#eef5ef" stroke="#4a7d5a" stroke-width="2"/>
  <defs>
    <pattern id="h" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="translate(80,110)">
      <circle cx="0" cy="0" r="2.6" fill="#b7c9bd"/>
    </pattern>
  </defs>
  <rect x="62" y="92" width="864" height="360" fill="url(#h)"/>

  <!-- power buses: row1 (+5V, y=110) red ; row10 (GND, y=434) black -->
  <line x1="80" y1="110" x2="908" y2="110" stroke="#d11" stroke-width="3"/>
  <text x="86" y="104" font-size="11" font-weight="bold" fill="#d11">+5 V bus (row 1)</text>
  <line x1="80" y1="434" x2="908" y2="434" stroke="#111" stroke-width="3"/>
  <text x="86" y="451" font-size="11" font-weight="bold" fill="#111">GND bus (row 10)</text>

  <!-- ===================== ESP32-C3 (cols2-9, rows3 & 8) ===================== -->
  <rect x="98" y="158" width="286" height="214" rx="6" fill="#e8eeff" stroke="#2d50a8" stroke-width="2" fill-opacity="0.7"/>
  <text x="241" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d50a8">ESP32-C3 SuperMini</text>
  <text x="241" y="280" text-anchor="middle" font-size="10" fill="#333">(on female headers)</text>
  <!-- top row r3 y=182 ; cols2..9 x=116,152,188,224,260,296,332,368 -->
  <g font-size="9" fill="#111" text-anchor="middle">
    <circle cx="116" cy="182" r="4.5" fill="#d11"/><text x="116" y="203">5V</text>
    <circle cx="152" cy="182" r="4.5" fill="#111"/><text x="152" y="203">G</text>
    <circle cx="188" cy="182" r="3.5" fill="#889"/><text x="188" y="203">3V3</text>
    <circle cx="224" cy="182" r="4.5" fill="#2d50a8"/><text x="224" y="203">IO4</text>
    <circle cx="260" cy="182" r="4.5" fill="#e67e22"/><text x="260" y="203">IO3</text>
    <circle cx="296" cy="182" r="3.5" fill="#889"/>
    <circle cx="332" cy="182" r="3.5" fill="#889"/>
    <circle cx="368" cy="182" r="3.5" fill="#889"/>
  </g>
  <!-- bottom row r8 y=362 -->
  <g font-size="9" fill="#111" text-anchor="middle">
    <circle cx="116" cy="362" r="4.5" fill="#1a8f3c"/><text x="116" y="352">IO5</text>
    <circle cx="152" cy="362" r="3.5" fill="#889"/><circle cx="188" cy="362" r="3.5" fill="#889"/>
    <circle cx="224" cy="362" r="3.5" fill="#889"/><circle cx="260" cy="362" r="3.5" fill="#889"/>
    <circle cx="296" cy="362" r="3.5" fill="#889"/><circle cx="332" cy="362" r="3.5" fill="#889"/>
    <circle cx="368" cy="362" r="3.5" fill="#889"/>
  </g>
  <!-- ESP power -->
  <path fill="none" d="M116,182 L116,110" stroke="#d11" stroke-width="2"/>
  <path fill="none" d="M152,182 L152,140 L140,140 L140,434" stroke="#111" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- ===================== 74HC125 DIP-14 (cols12-18, rows4 & 7) ===================== -->
  <rect x="470" y="194" width="248" height="144" rx="6" fill="#eafaf0" stroke="#1a8f3c" stroke-width="2" fill-opacity="0.7"/>
  <text x="594" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a8f3c">74HC125 (DIP-14)</text>
  <text x="594" y="275" text-anchor="middle" font-size="9" fill="#a33">HC: set buck ~4.4 V (see note)</text>
  <!-- bottom row r7 y=326: cols12..18 x=476,512,548,584,620,656,692 = pins1..7 -->
  <g font-size="9" fill="#111" text-anchor="middle">
    <circle cx="476" cy="326" r="4.5" fill="#111"/><text x="476" y="344">1 OE</text>
    <circle cx="512" cy="326" r="4.5" fill="#2d50a8"/><text x="512" y="344">2 A</text>
    <circle cx="548" cy="326" r="4.5" fill="#7a3fb0"/><text x="548" y="344">3 Y</text>
    <circle cx="584" cy="326" r="3.5" fill="#889"/>
    <circle cx="620" cy="326" r="3.5" fill="#889"/>
    <circle cx="656" cy="326" r="3.5" fill="#889"/>
    <circle cx="692" cy="326" r="4.5" fill="#111"/><text x="692" y="344">7 G</text>
  </g>
  <!-- top row r4 y=218 pin14 -->
  <circle cx="476" cy="218" r="4.5" fill="#d11"/><text x="476" y="212" font-size="9" fill="#111" text-anchor="middle">14 Vcc</text>
  <path fill="none" d="M476,218 L476,110" stroke="#d11" stroke-width="2"/>
  <path fill="none" d="M692,326 L692,434" stroke="#111" stroke-width="1.6"/>
  <path fill="none" d="M476,326 L458,326 L458,434" stroke="#111" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- GPIO4 -> 2A (back jumper) -->
  <path fill="none" d="M224,182 L224,150 L512,150 L512,326" stroke="#2d50a8" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="320" y="145" font-size="10" fill="#2d50a8">GPIO4 -&gt; 2A</text>

  <!-- 100 ohm (cols15-16 r7) + 1Y -> 100 -> PWM-motor header -->
  <rect x="600" y="318" width="60" height="16" rx="3" fill="#f3e8ff" stroke="#7a3fb0"/>
  <text x="630" y="314" text-anchor="middle" font-size="9" fill="#7a3fb0">100&#937;</text>
  <path fill="none" d="M548,326 L600,326" stroke="#7a3fb0" stroke-width="1.8"/>
  <path fill="none" d="M660,326 L730,326 L730,254 L908,254" stroke="#7a3fb0" stroke-width="1.8"/>
  <!-- pulldown 10k at c19 -->
  <rect x="716" y="344" width="16" height="48" rx="3" fill="#fff" stroke="#111"/>
  <text x="740" y="372" font-size="9" fill="#111">10k</text>
  <path fill="none" d="M724,326 L724,344" stroke="#111" stroke-width="1.4"/><path fill="none" d="M724,392 L724,434" stroke="#111" stroke-width="1.4"/>
  <path fill="none" d="M660,326 L724,326" stroke="#7a3fb0" stroke-width="1.1" stroke-dasharray="3,3"/>

  <!-- ===================== PC817 (DIP-4) (cols13-14 rows8-9) ===================== -->
  <rect x="500" y="356" width="90" height="66" rx="5" fill="#fdeef0" stroke="#b02a4a" stroke-width="2" fill-opacity="0.8"/>
  <text x="545" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="#b02a4a">PC817</text>
  <g font-size="8" fill="#111" text-anchor="middle">
    <circle cx="512" cy="398" r="4" fill="#1a8f3c"/><text x="502" y="394">1</text>
    <circle cx="512" cy="420" r="4" fill="#111"/>
    <circle cx="584" cy="398" r="4" fill="#8a5a2b"/><text x="594" y="394">4</text>
    <circle cx="584" cy="420" r="4" fill="#8a5a2b"/>
  </g>
  <!-- 330 ohm (cols10-11 r8) GPIO5->330->opto1 -->
  <rect x="404" y="354" width="50" height="16" rx="3" fill="#eafaf0" stroke="#1a8f3c"/>
  <text x="429" y="350" text-anchor="middle" font-size="9" fill="#1a8f3c">330&#937;</text>
  <path fill="none" d="M116,362 L116,388 L404,388 L404,362" stroke="#1a8f3c" stroke-width="1.8" stroke-dasharray="5,4"/>
  <path fill="none" d="M454,362 L470,362 L470,398 L512,398" stroke="#1a8f3c" stroke-width="1.8"/>
  <text x="210" y="384" font-size="10" fill="#1a8f3c">GPIO5 -&gt; 330 -&gt; opto</text>
  <path fill="none" d="M512,420 L490,420 L490,434" stroke="#111" stroke-width="1.5"/>
  <!-- opto out -> SW5 header (right) -->
  <path fill="none" d="M584,398 L760,398 L760,362 L908,362" stroke="#8a5a2b" stroke-width="1.6"/>
  <path fill="none" d="M584,420 L780,420 L780,398 L908,398" stroke="#8a5a2b" stroke-width="1.6"/>

  <!-- ===================== divider/RC near header (cols20-22 row3) ===================== -->
  <rect x="740" y="176" width="40" height="16" rx="3" fill="#fff" stroke="#e67e22"/><text x="760" y="172" text-anchor="middle" font-size="9" fill="#e67e22">10k</text>
  <circle cx="710" cy="182" r="4" fill="#e67e22"/><text x="710" y="202" font-size="8" text-anchor="middle" fill="#111">nX</text>
  <path fill="none" d="M908,182 L780,182" stroke="#e67e22" stroke-width="1.8"/>
  <path fill="none" d="M740,182 L710,182" stroke="#e67e22" stroke-width="1.8"/>
  <path fill="none" d="M710,182 L420,182 L420,150 L260,150 L260,182" stroke="#e67e22" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="300" y="130" font-size="10" fill="#e67e22">node X -&gt; GPIO3</text>
  <rect x="676" y="200" width="16" height="44" rx="3" fill="#fff" stroke="#111"/><text x="658" y="226" font-size="9" fill="#111">10k</text>
  <path fill="none" d="M684,182 L684,200" stroke="#111" stroke-width="1.4"/><path fill="none" d="M684,244 L684,434" stroke="#111" stroke-width="1.4"/>
  <rect x="712" y="200" width="16" height="44" rx="3" fill="#fff" stroke="#111"/><text x="734" y="226" font-size="9" fill="#111">1uF</text>
  <path fill="none" d="M720,182 L720,200" stroke="#111" stroke-width="1.2"/><path fill="none" d="M720,244 L720,434" stroke="#111" stroke-width="1.2"/>

  <!-- ===================== MP1584 buck (cols19-22 rows5-7) ===================== -->
  <rect x="716" y="270" width="120" height="70" rx="6" fill="#fff3e0" stroke="#b36b00" stroke-width="2" fill-opacity="0.85"/>
  <text x="776" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b36b00">MP1584</text>
  <text x="776" y="316" text-anchor="middle" font-size="9" fill="#333">24-&gt;4.4 V</text>
  <g font-size="8" fill="#111">
    <circle cx="726" cy="330" r="4" fill="#d11"/><text x="732" y="326">24in+</text>
    <circle cx="826" cy="330" r="4" fill="#111"/>
    <circle cx="726" cy="280" r="4" fill="#d11"/><text x="732" y="276">5out+</text>
    <circle cx="826" cy="280" r="4" fill="#111"/>
  </g>
  <path fill="none" d="M726,280 L726,110" stroke="#d11" stroke-width="2"/>
  <path fill="none" d="M826,330 L826,434" stroke="#111" stroke-width="1.4"/>
  <path fill="none" d="M726,330 L700,330 L700,254 L908,254" stroke="#d11" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="705" y="345" font-size="8" fill="#d11">24in &lt;- +24V hdr</text>

  <!-- ===================== header (col24, rows2-9) ===================== -->
  <g font-size="9" fill="#111">
    <circle cx="908" cy="182" r="5" fill="#e67e22"/><text x="878" y="168" text-anchor="end">PWM-ctrl</text>
    <circle cx="908" cy="254" r="5" fill="#7a3fb0"/><text x="884" y="248" text-anchor="end">PWM-mot/+24V</text>
    <circle cx="908" cy="290" r="5" fill="#111"/><text x="884" y="294" text-anchor="end">GND</text>
    <circle cx="908" cy="362" r="5" fill="#8a5a2b"/><text x="884" y="366" text-anchor="end">SW5-a</text>
    <circle cx="908" cy="398" r="5" fill="#8a5a2b"/><text x="884" y="402" text-anchor="end">SW5-b</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <text x="62" y="492" font-weight="bold" fill="#111">Legend:</text>
    <line x1="120" y1="488" x2="148" y2="488" stroke="#444" stroke-width="2"/><text x="154" y="492" fill="#111">front link</text>
    <line x1="250" y1="488" x2="278" y2="488" stroke="#444" stroke-width="2" stroke-dasharray="5,4"/><text x="284" y="492" fill="#111">back jumper</text>
    <line x1="400" y1="488" x2="428" y2="488" stroke="#d11" stroke-width="3"/><text x="434" y="492" fill="#111">+5/24V</text>
    <line x1="510" y1="488" x2="538" y2="488" stroke="#111" stroke-width="3"/><text x="544" y="492" fill="#111">GND</text>
    <line x1="600" y1="488" x2="628" y2="488" stroke="#e67e22" stroke-width="3"/><text x="634" y="492" fill="#111">PWM in</text>
    <line x1="700" y1="488" x2="728" y2="488" stroke="#2d50a8" stroke-width="3"/><text x="734" y="492" fill="#111">GPIO4</text>
    <line x1="800" y1="488" x2="828" y2="488" stroke="#7a3fb0" stroke-width="3"/><text x="834" y="492" fill="#111">5V PWM</text>
    <line x1="120" y1="512" x2="148" y2="512" stroke="#1a8f3c" stroke-width="3"/><text x="154" y="516" fill="#111">oscillation</text>
    <line x1="250" y1="512" x2="278" y2="512" stroke="#8a5a2b" stroke-width="3"/><text x="284" y="516" fill="#111">SW5 tap</text>
  </g>
  <text x="62" y="548" font-size="11" fill="#555">Grey = unused module pins. ESP + buck are modules on headers; only the DIP, PC817 (DIP-4), resistors and cap sit in the grid.</text>
  <text x="62" y="566" font-size="11" fill="#555">Board has roomy spare columns (right of the header is free) - leave slack for strain relief. 74HC125: run buck ~4.4 V (see BUILD_GUIDE).</text>
  <text x="62" y="584" font-size="11" fill="#555">PWM-motor and +24V share a header label for space; wire them to separate CN2 pins (see §2b/§2e).</text>
</svg>
